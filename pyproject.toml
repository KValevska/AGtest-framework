[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymoo-gui-framework"
version = "0.1.0"
description = "GUI framework for running pymoo algorithms on pymoo problems (refactor of the provided app.py)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "matplotlib>=3.7",
  "PyQt5>=5.15",
  "pyqtgraph>=0.13",
  "pymoo>=0.6.0",
  "platypus-opt>=1.4.1",
]

[project.scripts]
pymoo-gui = "pymoo_gui.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
