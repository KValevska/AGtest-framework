[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "AGtest-framework"
version = "0.1"
description = "Desktop framework for configuring and analyzing multi-objective optimization experiments"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "matplotlib>=3.7",
  "PyQt5>=5.15",
  "pyqtgraph>=0.13",
  "pymoo>=0.6.0",
  "platypus-opt>=1.4.1",
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
build = [
  "pyinstaller>=6.11,<7",
]

[project.scripts]
AGtest-framework = "pymoo_gui.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pymoo_gui.problems" = ["*.pf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
